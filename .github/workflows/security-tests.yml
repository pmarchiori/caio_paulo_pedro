name: Security tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-tests:
    name: pytest security suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SECRET_KEY: ci-only-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run security tests
        run: python -m pytest -q fastapi/tests/test_security.py
