services:
  api:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    environment:
      - SECRET_KEY=${SECRET_KEY}
    expose:
      - "8000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api
    restart: unless-stopped
